<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>录像光码发送器 V4</title><meta name="theme-color" content="#090b10">
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    .v4-badge{color:#62dfa0;font-weight:800}.cycle-card{width:min(92vw,720px);padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
    .cycle-head{display:flex;justify-content:space-between;gap:12px}.cycle-head b{color:#62dfa0}.cycle-bar{height:8px;margin-top:12px;overflow:hidden;border-radius:9px;background:#282f3c}.cycle-bar div{height:100%;width:0;background:linear-gradient(90deg,#62dfa0,var(--accent2))}
  </style>
</head>
<body>
  <header class="app-header"><div class="eyebrow">QRREC V4 · RECORD NOW, DECODE LATER</div><h1>录像光码发送器 <span class="v4-badge">V4</span></h1><p>固定周期播放完整数据。接收端录完即可放下手机，再在本地离线解码。</p></header>
  <section class="file-card"><input id="file" type="file"><label for="file" class="file-pick"><span class="file-icon">＋</span><span><strong>选择要发送的文件</strong><small>支持图片、视频、文档和压缩包；文件不会上传网络</small></span></label><div id="file-info" class="file-info">尚未选择文件</div></section>
  <div class="hint" id="specs">选择文件后计算完整周期</div>
  <details class="settings"><summary>传输设置</summary><div class="row">
    <label>播放帧率<select id="cfg-fps"><option>10</option><option selected>15</option><option>20</option></select></label>
    <label>每码数据量<select id="cfg-bytes"><option>700</option><option selected>1000</option><option>1465</option></select></label>
    <label>光码数量<select id="cfg-codes"><option>1</option><option selected>2</option></select></label>
    <label>周期冗余<select id="cfg-overhead"><option value="1.25">25%</option><option value="1.35" selected>35%</option><option value="1.5">50%</option></select></label>
  </div><div class="hint left">录像环境复杂时提高冗余；降低帧率可增加每个二维码在录像中的清晰帧数量。</div></details>
  <section class="cycle-card" id="cycle-card" style="display:none"><div class="cycle-head"><span>当前播放周期 <b id="cycle-number">1</b></span><span id="cycle-clock">0.0 / 0.0 秒</span></div><div class="cycle-bar"><div id="cycle-bar"></div></div><p class="hint" id="record-hint"></p></section>
  <div class="receiver-link"><span>录像接收端：</span><a href="https://qrrec.liuwa.xyz/v4/">qrrec.liuwa.xyz/v4</a></div>
  <div class="stage-wrap"><div class="dual-stage"><div class="stage"><canvas id="qr-a" width="16" height="16"></canvas></div><div class="stage" id="stage-b"><canvas id="qr-b" width="16" height="16"></canvas></div></div></div>
  <p class="hint">接收端录制达到建议时长后即可停止，后续解码不需要继续对准屏幕。</p>
  <script type="module" src="./main.ts"></script>
</body></html>
