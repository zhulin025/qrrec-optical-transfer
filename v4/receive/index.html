<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>录像光码接收器 V4</title><meta name="theme-color" content="#090b10"><link rel="stylesheet" href="../../shared/style.css"><style>
  .v4-badge{color:#62dfa0}.recording{background:#ef5267!important}.offline-card{width:min(92vw,640px);padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}#record-preview{aspect-ratio:3/4;overflow:hidden;border-radius:18px}#record-preview video{width:100%;height:100%;object-fit:cover}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.actions input{display:none}#decode-video,#decode-canvas{display:none}
</style></head><body>
<header class="app-header"><div class="eyebrow">QRREC V4 · RECORD NOW, DECODE LATER</div><h1>录像光码接收器 <span class="v4-badge">V4</span></h1><p>先录制完整光码周期，停止后即可放下手机，文件会在本地逐帧解码。</p></header>
<div class="hint status-pill" id="status">准备录像</div>
<section class="capabilities"><div id="cap-secure"><span></span><small>安全环境</small><b>检测中</b></div><div id="cap-camera"><span></span><small>摄像头</small><b>待启动</b></div><div id="cap-record"><span></span><small>录像</small><b>待启动</b></div><div id="cap-wasm"><span></span><small>离线解码</small><b>待加载</b></div></section>
<details class="settings"><summary>录像设置</summary><div class="row"><label>目标时长（秒）<input id="target-seconds" type="number" min="5" max="600" value="30"></label><label>录像清晰度<select id="record-width"><option>720</option><option selected>1080</option><option>1280</option></select></label></div><div class="hint left">把发送端显示的“建议录像时长”填在这里；也可以手动停止。</div></details>
<div class="actions"><button id="record">开始录像</button><label class="secondary-button" for="video-file">选择已有录像</label><input id="video-file" type="file" accept="video/*"></div>
<div class="preview" id="record-preview" style="display:none"><video id="camera" muted playsinline></video><div class="scan-guide"><span></span></div></div>
<section class="offline-card" id="offline" style="display:none"><div class="progress-copy"><div><strong id="phase">准备离线解码</strong><span id="detail">—</span></div><b id="percent">0%</b></div><div class="progress"><div id="bar"></div></div></section>
<div class="metrics" id="metrics" style="display:none"><div class="metric"><div class="k">录像时长</div><div class="v" id="m-duration">—</div></div><div class="metric"><div class="k">已分析视频</div><div class="v amber" id="m-time">—</div></div><div class="metric"><div class="k">解码新帧/重复</div><div class="v" id="m-frames">0/0</div></div><div class="metric"><div class="k">文件重组</div><div class="v amber" id="m-file">等待数据</div></div></div>
<div id="result"></div><video id="decode-video" muted playsinline></video><canvas id="decode-canvas"></canvas><script type="module" src="./main.ts"></script>
</body></html>
