<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>QRREC 彩色矩阵解码运行层</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}html,body,#container,video{width:100%;height:100%;overflow:hidden;background:#05070a}
    video{display:block;object-fit:cover}.compat{display:none!important}
  </style>
</head>
<body>
  <div id="container"><video id="video" autoplay playsinline muted></video></div>
  <div class="compat">
    <div id="crosshair1"></div><div id="crosshair2"></div>
    <div id="nav-container" class="mode-auto">
      <button id="nav-button"></button><div id="nav-content"></div><span id="mode-val">Auto</span>
    </div>
    <div id="debug-button"></div>
    <div id="errorbox"></div><div id="t0"></div><div id="t1"></div><div id="t2"></div><div id="t3"></div>
    <div id="framesInFlight"></div><div id="tdec"></div><div id="progress_bars"><div class="progress"></div></div>
  </div>
  <script src="recv.2026-07-13T0523.js"></script>
  <script src="zstd.2026-07-13T0523.js"></script>
  <script>
    Recv.init_ww(4);
    const video = document.querySelector('#video');
    let runtimeReady = false;
    var Module = {
      onRuntimeInitialized() {
        runtimeReady = true;
        parent.postMessage({source:'qrrec-color',type:'runtime-ready'}, location.origin);
        Recv.init_video(video);
      },
      onAbort(reason) {
        parent.postMessage({source:'qrrec-color',type:'runtime-error',phase:'wasm',reason:String(reason)}, location.origin);
      }
    };
    video.addEventListener('playing',()=>parent.postMessage({source:'qrrec-color',type:'camera-ready',width:video.videoWidth,height:video.videoHeight},location.origin));
    window.addEventListener('error',event=>parent.postMessage({
      source:'qrrec-color',
      type:'runtime-error',
      phase:runtimeReady?'decode':'startup',
      reason:event.message
    },location.origin));
  </script>
  <script src="cimbar_js.2026-07-13T0523.js"></script>
</body>
</html>
